  其实如果色感够强的话，用标准色谱和532nm的绿光激光笔（最好是绿光，没有四色视觉的人看不到很多高饱和绿色）就可以一定程度量化致各种药和致幻剂对颜色的影响 激光笔对视觉残留类的持续时间测量效果很好 对标准色谱调色可以发现很多绿色系不同，而且不同饱合度的同色料颜料的差异也会被放大
